services:
  app: 
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
    depends_on:
        db:
           condition: service_healthy

  db:
    image: postgres
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=devops_app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5